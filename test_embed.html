<!DOCTYPE html>
<html>
<head><title>Test PDF Embed</title></head>
<body>
  <h2>1. Object with URL encoded</h2>
  <object data="document/PPT%20Seminar%20PPG.pdf" type="application/pdf" width="100%" height="400px">
    <p>Browser tidak dapat menampilkan PDF secara langsung. <a href="document/PPT%20Seminar%20PPG.pdf" target="_blank">Klik di sini untuk membuka PDF</a>.</p>
  </object>

  <h2>2. Embed tag</h2>
  <embed src="document/PPT%20Seminar%20PPG.pdf" type="application/pdf" width="100%" height="400px" />

  <h2>3. Iframe with URL encoded</h2>
  <iframe src="document/PPT%20Seminar%20PPG.pdf" width="100%" height="400px"></iframe>
</body>
</html>
